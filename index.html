<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AzMath — Matematika · Fizika · Ingliz tili · Ona tili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#EAF1FB;
    --bg-2:#F4F8FD;
    --surface:#FFFFFF;
    --border:#DCE6F3;
    --primary:#3D6FE0;
    --primary-dark:#233F87;
    --primary-light:#7FA8F0;
    --ink:#1D2A3F;
    --ink-soft:#5E6C82;
    --ink-faint:#93A1B6;
    --success:#2A9D6F;
    --success-bg:#E4F6EE;
    --danger:#DD5347;
    --danger-bg:#FCEAE8;
    --warn-bg:#FFF3DE;
    --warn-ink:#9A6A11;
    --radius-lg:20px;
    --radius:14px;
    --radius-sm:9px;
    --shadow-sm:0 2px 10px rgba(30,58,120,0.06);
    --shadow:0 12px 32px rgba(24,52,110,0.10);
    --font-d:'Space Grotesk',sans-serif;
    --font-b:'Inter',sans-serif;
    --font-m:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    font-family:var(--font-b);
    color:var(--ink);
    background:
      radial-gradient(1100px 480px at 85% -10%, #DCE9FB 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 10%, #E7EFFC 0%, transparent 55%),
      var(--bg);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-d);margin:0;color:var(--ink);letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:var(--font-b);cursor:pointer;}
  a{color:inherit;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  ::selection{background:var(--primary-light);color:#fff;}

  /* ---------- shared bits ---------- */
  .container{width:100%;max-width:1080px;margin:0 auto;padding:0 24px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 32px;background:rgba(255,255,255,0.7);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-d);font-weight:700;font-size:15px;flex-shrink:0;
    box-shadow:var(--shadow-sm);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.1;}
  .brand-text b{font-family:var(--font-d);font-size:17px;font-weight:700;}
  .brand-text span{font-size:11px;color:var(--ink-soft);letter-spacing:.04em;}
  .btn{
    border:none;border-radius:11px;padding:11px 20px;font-size:14.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(61,111,224,0.28);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--primary-light);color:var(--primary-dark);}
  .btn-soft{background:#EEF4FD;color:var(--primary-dark);}
  .btn-soft:hover{background:#E0ECFC;}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-danger:hover{background:#F9D9D6;}
  .btn-sm{padding:7px 13px;font-size:13px;border-radius:8px;}
  .btn-block{width:100%;justify-content:center;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
  .pad-lg{padding:36px;}
  .pad{padding:24px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);
    font-family:var(--font-b);font-size:14.5px;color:var(--ink);background:var(--bg-2);
    transition:border-color .15s ease, background .15s ease;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);background:#fff;}
  .field textarea{resize:vertical;min-height:120px;font-family:var(--font-m);font-size:13px;line-height:1.6;}
  .hint{font-size:12.5px;color:var(--ink-faint);margin-top:6px;line-height:1.5;}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:600;}
  .badge-blue{background:#E9F0FD;color:var(--primary-dark);}
  .badge-green{background:var(--success-bg);color:var(--success);}
  .badge-red{background:var(--danger-bg);color:var(--danger);}
  .badge-gray{background:#EEF1F6;color:var(--ink-soft);}

  .footer-note{text-align:center;color:var(--ink-faint);font-size:12.5px;padding:26px 16px 34px;}

  /* ---------- Home / hero ---------- */
  .hero{padding:64px 24px 20px;text-align:center;position:relative;}
  .orbit-wrap{width:220px;height:220px;margin:0 auto 28px;position:relative;}
  .orbit-ring{position:absolute;inset:0;border:1.5px dashed #C7D8F3;border-radius:50%;animation:spin 32s linear infinite;}
  @media (prefers-reduced-motion: reduce){.orbit-ring{animation:none;}}
  .orbit-core{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:92px;height:92px;border-radius:26px;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--font-d);font-weight:700;font-size:26px;box-shadow:0 16px 34px rgba(36,65,140,0.28);
  }
  .orbit-node{
    position:absolute;width:52px;height:52px;border-radius:14px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:16px;
    box-shadow:var(--shadow-sm);border:1px solid var(--border);
  }
  .hero h1{font-size:clamp(28px,4.4vw,42px);font-weight:700;max-width:640px;margin:0 auto;}
  .hero .accent{color:var(--primary);}
  .hero p.lead{max-width:520px;margin:14px auto 0;color:var(--ink-soft);font-size:15.5px;line-height:1.6;}

  .subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:36px;}
  .subject-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:26px 22px;text-align:left;cursor:pointer;transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    display:flex;flex-direction:column;gap:14px;
  }
  .subject-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--primary-light);}
  .subject-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:700;font-size:17px;color:#fff;box-shadow:0 8px 18px -6px rgba(20,40,90,0.45);}
  @keyframes riseIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .card{animation:riseIn .45s cubic-bezier(.2,.7,.3,1) both;}
  @media (prefers-reduced-motion: reduce){.card{animation:none;}}
  .subject-card:nth-child(1){animation-delay:.02s;}
  .subject-card:nth-child(2){animation-delay:.08s;}
  .subject-card:nth-child(3){animation-delay:.14s;}
  .subject-card:nth-child(4){animation-delay:.2s;}
  .subject-card h3{font-size:18px;}
  .subject-card .meta{font-size:12.5px;color:var(--ink-faint);}

  .admin-link{position:fixed;bottom:20px;right:22px;z-index:30;}

  /* ---------- Student form ---------- */
  .center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .form-card{width:100%;max-width:440px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13.5px;font-weight:600;margin-bottom:18px;background:none;border:none;padding:0;}
  .back-link:hover{color:var(--primary);}

  /* ---------- Test screen ---------- */
  .test-header{
    display:flex;align-items:center;justify-content:space-between;padding:16px 32px;
    background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  .timer-chip{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);
    padding:8px 16px;border-radius:100px;font-family:var(--font-m);font-weight:600;font-size:15px;
  }
  .timer-chip.low{border-color:var(--danger);color:var(--danger);background:var(--danger-bg);}
  .timer-dot{width:8px;height:8px;border-radius:50%;background:var(--success);}
  .timer-chip.low .timer-dot{background:var(--danger);}
  .progress-track{height:5px;background:#E4EBF7;border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary-light),var(--primary));transition:width .25s ease;}

  .test-body{flex:1;display:flex;justify-content:center;padding:36px 20px 60px;}
  .test-card{width:100%;max-width:680px;}
  .q-index{font-family:var(--font-m);color:var(--primary);font-weight:600;font-size:13px;margin-bottom:10px;letter-spacing:.02em;}
  .q-text{font-size:20px;font-weight:600;line-height:1.5;margin-bottom:26px;font-family:var(--font-d);}
  .option-btn{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 18px;
    border:1.5px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:11px;
    font-size:15px;color:var(--ink);transition:all .13s ease;
  }
  .option-btn:hover{border-color:var(--primary-light);background:#F7FAFF;}
  .option-btn.selected{border-color:var(--primary);background:#EEF4FE;box-shadow:0 0 0 3px rgba(61,111,224,0.12);}
  .option-letter{
    width:28px;height:28px;border-radius:8px;background:#EEF1F6;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;
    font-family:var(--font-d);
  }
  .option-btn.selected .option-letter{background:var(--primary);color:#fff;}
  .test-nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;}
  .qnav-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px;}
  .qnav-dot{
    width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);
    font-size:12px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
  }
  .qnav-dot.answered{background:var(--primary);border-color:var(--primary);color:#fff;}
  .qnav-dot.current{box-shadow:0 0 0 3px rgba(61,111,224,0.25);}

  /* ---------- Result screen ---------- */
  .result-wrap{max-width:520px;margin:0 auto;text-align:center;}
  .score-ring{width:150px;height:150px;margin:8px auto 20px;position:relative;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .score-ring .pct b{font-family:var(--font-d);font-size:30px;}
  .score-ring .pct span{font-size:11.5px;color:var(--ink-faint);}
  .result-stats{display:flex;gap:10px;margin:22px 0;}
  .stat-box{flex:1;background:var(--bg-2);border-radius:12px;padding:14px 8px;}
  .stat-box b{font-family:var(--font-m);font-size:18px;display:block;}
  .stat-box span{font-size:11.5px;color:var(--ink-soft);}

  /* ---------- Admin ---------- */
  .admin-shell{display:flex;min-height:100vh;}
  .admin-sidebar{
    width:236px;flex-shrink:0;background:linear-gradient(180deg,var(--primary-dark),#182E63);
    color:#fff;padding:26px 18px;display:flex;flex-direction:column;
  }
  .admin-sidebar .brand-text b,.admin-sidebar .brand-text span{color:#fff;}
  .admin-nav{margin-top:30px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .admin-nav button{
    text-align:left;background:none;border:none;color:#C9D6F2;padding:11px 14px;border-radius:10px;
    font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;
  }
  .admin-nav button:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .admin-nav button.active{background:rgba(255,255,255,0.16);color:#fff;}
  .admin-main{flex:1;padding:34px 40px;max-width:calc(100% - 236px);}
  .admin-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
  .stat-card b{font-family:var(--font-d);font-size:26px;display:block;}
  .stat-card span{font-size:12.5px;color:var(--ink-soft);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1.5px solid var(--border);}
  td{padding:12px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  tr.clickable:hover{background:var(--bg-2);cursor:pointer;}

  .tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1.5px solid var(--border);flex-wrap:wrap;}
  .tab{padding:11px 16px;font-size:14px;font-weight:600;color:var(--ink-soft);background:none;border:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;}
  .tab.active{color:var(--primary);border-color:var(--primary);}

  .q-preview-card{border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;background:var(--surface);}
  .q-preview-card .opt-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px;color:var(--ink-soft);}
  .q-preview-card .opt-row.correct{color:var(--success);font-weight:600;}
  .opt-mark{width:20px;height:20px;border-radius:6px;background:#EEF1F6;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0;}
  .opt-row.correct .opt-mark{background:var(--success-bg);color:var(--success);}
  .q-preview-actions{display:flex;gap:8px;margin-top:12px;}

  .modal-bg{position:fixed;inset:0;background:rgba(20,32,60,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-box{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:28px;box-shadow:var(--shadow);}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint);}
  .empty-state b{display:block;color:var(--ink-soft);margin-bottom:6px;font-size:15px;}

  .msg-banner{padding:14px 18px;border-radius:12px;font-size:14px;font-weight:500;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
  .msg-banner.error{background:var(--danger-bg);color:var(--danger);}
  .msg-banner.warn{background:var(--warn-bg);color:var(--warn-ink);}
  .msg-banner.ok{background:var(--success-bg);color:var(--success);}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid-2 > *{min-width:0;}
  .admin-main{min-width:0;}
  @media(max-width:560px){.grid-2{grid-template-columns:1fr;}}

  @media (max-width:860px){
    .admin-shell{flex-direction:column;}
    .admin-sidebar{width:100%;flex-direction:row;align-items:center;padding:14px 18px;}
    .admin-nav{flex-direction:row;margin-top:0;overflow-x:auto;}
    .admin-main{max-width:100%;padding:22px 18px;}
  }
  @media (max-width:520px){
    .topbar{padding:14px 18px;}
    .hero{padding:40px 16px 10px;}
    .test-header{padding:12px 16px;}
    .test-body{padding:22px 12px 50px;}
    .q-text{font-size:17px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="pdf-template"></div>

<script>
/* ============================= DATA / CONSTANTS ============================= */
const SUBJECTS = {
  matematika: {label:'Matematika', short:'Mat', icon:'Σ', color:'#3D6FE0', grad:'linear-gradient(135deg,#5A8BF0,#233F87)'},
  fizika:     {label:'Fizika',     short:'Fiz', icon:'⚛', color:'#2A9D6F', grad:'linear-gradient(135deg,#4EC194,#1C7350)'},
  ingliz:     {label:'Ingliz tili',short:'Eng', icon:'EN', color:'#D69A1F', grad:'linear-gradient(135deg,#F0BE55,#B37D0F)'},
  ona:        {label:"Ona tili",   short:'Ona', icon:"Ў", color:'#C2533D', grad:'linear-gradient(135deg,#E77A66,#9A3C29)'},
};
const DEFAULT_SETTINGS = {
  login:'admin', password:'admin123',
  subjects:{
    matematika:{count:10,time:15},
    fizika:{count:10,time:15},
    ingliz:{count:10,time:15},
    ona:{count:10,time:15},
  }
};
const CREATOR = "Butunboyev Azizbek";

/* ============================= STATE ============================= */
let state = {
  view:'home',
  settings:null,
  subject:null,
  student:null,
  bank:[],
  quiz:[],
  qIndex:0,
  answers:{},
  timeLeftSec:0,
  timerHandle:null,
  terminated:false,
  lastResult:null,
  admin:{ loggedIn:false, tab:'natijalar', qSubject:'matematika', results:[], resultDetail:null, bulkText:'', editingQ:null, msg:null }
};

const app = document.getElementById('app');

/* ============================= STORAGE HELPERS ============================= */
/* Three tiers, tried in order and cached once detected:
   1) window.storage  — only exists inside Claude.ai's artifact viewer (syncs across devices)
   2) localStorage     — works once this file is served from http(s):// or file:// in most browsers
   3) in-memory object — last-resort fallback so the app still works within the current tab
      even if the browser blocks all persistent storage (e.g. some browsers restrict it for
      file:// pages). Data added in memory-only mode is lost on refresh — use the backup
      export/import buttons in "Savollar bazasi" to keep a copy safe. */
const hasCloudStorage = !!(window.storage && typeof window.storage.get==='function' && typeof window.storage.set==='function');
let activeBackend = null; // 'cloud' | 'local' | 'memory'
const memoryDB = {};
function lsPrefixBase(shared){ return shared ? 'azmath_shared__' : 'azmath_priv__'; }
function lsKey(key, shared){ return lsPrefixBase(shared) + key; }
function safeParse(v){
  if(v===null || v===undefined) return null;
  if(typeof v !== 'string') return v;
  try{ return JSON.parse(v); } catch(e){ return v; }
}
async function detectBackend(){
  if(activeBackend) return activeBackend;
  if(hasCloudStorage){
    try{
      await window.storage.set('__probe__', JSON.stringify({t:Date.now()}), false);
      const r = await window.storage.get('__probe__', false);
      if(r){ activeBackend='cloud'; return activeBackend; }
    }catch(e){ /* fall through */ }
  }
  try{
    const k='__probe__'+Date.now();
    localStorage.setItem(k,'1');
    const ok = localStorage.getItem(k)==='1';
    localStorage.removeItem(k);
    if(ok){ activeBackend='local'; return activeBackend; }
  }catch(e){ /* fall through */ }
  activeBackend='memory';
  return activeBackend;
}
async function storeGet(key, shared){
  const mode = await detectBackend();
  try{
    if(mode==='cloud'){
      const r = await window.storage.get(key, !!shared);
      return r ? safeParse(r.value) : null;
    }
    if(mode==='local'){
      const raw = localStorage.getItem(lsKey(key, shared));
      return raw===null ? null : safeParse(raw);
    }
    const raw = memoryDB[lsKey(key, shared)];
    return raw===undefined ? null : safeParse(raw);
  }catch(e){ console.error('storage get failed', e); return null; }
}
async function storeSet(key, value, shared){
  const mode = await detectBackend();
  const payload = JSON.stringify(value);
  try{
    if(mode==='cloud'){ await window.storage.set(key, payload, !!shared); }
    else if(mode==='local'){ localStorage.setItem(lsKey(key, shared), payload); }
    else { memoryDB[lsKey(key, shared)] = payload; }
    return true;
  }catch(e){ console.error('storage set failed', e); return false; }
}
async function storeListKeys(prefix, shared){
  const mode = await detectBackend();
  try{
    if(mode==='cloud'){
      const r = await window.storage.list(prefix||'', !!shared);
      return r ? r.keys : [];
    }
    if(mode==='local'){
      const base = lsPrefixBase(shared);
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith(base)){
          const bare = k.slice(base.length);
          if(bare.startsWith(prefix||'')) keys.push(bare);
        }
      }
      return keys;
    }
    const base = lsPrefixBase(shared);
    return Object.keys(memoryDB).filter(k=>k.startsWith(base)).map(k=>k.slice(base.length)).filter(k=>k.startsWith(prefix||''));
  }catch(e){ console.error('storage list failed', e); return []; }
}

function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function norm(s){ return (s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString('uz-UZ')+' '+d.toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'}); }

/* ============================= SETTINGS ============================= */
async function loadSettings(){
  let s = await storeGet('settings', true);
  if(!s){
    s = DEFAULT_SETTINGS;
    await storeSet('settings', s, true);
  } else {
    s = Object.assign({}, DEFAULT_SETTINGS, s);
    s.subjects = Object.assign({}, DEFAULT_SETTINGS.subjects, s.subjects||{});
  }
  state.settings = s;
  return s;
}
async function saveSettings(){ return await storeSet('settings', state.settings, true); }

/* ============================= QUESTIONS ============================= */
async function loadQuestions(subjectKey){
  const q = await storeGet('questions:'+subjectKey, true);
  return q || [];
}
async function saveQuestions(subjectKey, arr){
  return await storeSet('questions:'+subjectKey, arr, true);
}

/* ============================= RESULTS ============================= */
async function saveResult(result){
  await storeSet('result:'+result.id, result, true);
}
async function loadAllResults(){
  const keys = await storeListKeys('result:', true);
  const out = [];
  for(const k of keys){
    const r = await storeGet(k, true);
    if(r) out.push(r);
  }
  out.sort((a,b)=> b.finishedAt - a.finishedAt);
  return out;
}
async function findPriorAttempt(subjectKey, ism, familiya, guruh){
  const keys = await storeListKeys('result:', true);
  const target = norm(ism)+'|'+norm(familiya)+'|'+norm(guruh);
  for(const k of keys){
    const r = await storeGet(k, true);
    if(r && r.subject===subjectKey){
      const key = norm(r.student.ism)+'|'+norm(r.student.familiya)+'|'+norm(r.student.guruh);
      if(key===target) return r;
    }
  }
  return null;
}

/* ============================= TEST FLOW ============================= */
async function startTest(bank){
  const cfg = state.settings.subjects[state.subject] || {count:10,time:15};
  const count = Math.min(cfg.count, bank.length);
  const picked = shuffle(bank).slice(0, count);

  state.quiz = picked.map(q=>{
    const optIdx = [0,1,2,3];
    const optOrder = shuffle(optIdx);
    const options = optOrder.map(i=>q.options[i]);
    const correctIndex = optOrder.indexOf(q.correctIndex);
    return { id:q.id, text:q.text, options, correctIndex };
  });
  state.qIndex = 0;
  state.answers = {};
  state.terminated = false;
  state.timeLeftSec = cfg.time*60;
  state.view = 'test';
  render();
  startTimer();
  document.addEventListener('visibilitychange', onVisibilityChange);
}

function startTimer(){
  clearTimer();
  state.timerHandle = setInterval(()=>{
    state.timeLeftSec--;
    if(state.timeLeftSec<=0){
      clearTimer();
      finishTest(false);
      return;
    }
    updateTimerUI();
  },1000);
}
function clearTimer(){ if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle=null; } }

function updateTimerUI(){
  const chip = document.getElementById('timerChip');
  if(!chip) return;
  chip.textContent = '';
  const low = state.timeLeftSec <= 60;
  chip.parentElement.classList.toggle('low', low);
  chip.innerHTML = `<span class="timer-dot"></span> ${fmtTime(state.timeLeftSec)}`;
}

function onVisibilityChange(){
  if(document.hidden && state.view==='test' && !state.terminated){
    state.terminated = true;
    finishTest(true);
  }
}

function renderTest(){
  const q = state.quiz[state.qIndex];
  const total = state.quiz.length;
  const answeredCount = Object.keys(state.answers).length;
  const pct = Math.round(((state.qIndex)/total)*100);

  const options = q.options.map((opt,i)=>{
    const sel = state.answers[q.id]===i;
    return `<button class="option-btn ${sel?'selected':''}" onclick="selectOption(${i})">
      <span class="option-letter">${String.fromCharCode(65+i)}</span>
      <span>${escapeHtml(opt)}</span>
    </button>`;
  }).join('');

  const dots = state.quiz.map((qq,i)=>{
    const cls = ['qnav-dot'];
    if(state.answers[qq.id]!==undefined) cls.push('answered');
    if(i===state.qIndex) cls.push('current');
    return `<button class="${cls.join(' ')}" onclick="jumpTo(${i})">${i+1}</button>`;
  }).join('');

  app.innerHTML = `
    <div class="test-header">
      <div>
        <div style="font-family:var(--font-d);font-weight:700;font-size:15px;">${SUBJECTS[state.subject].icon} ${SUBJECTS[state.subject].label}</div>
        <div style="font-size:12px;color:var(--ink-soft);">${state.student.ism} ${state.student.familiya} · ${state.student.guruh}</div>
      </div>
      <div class="timer-chip"><span id="timerChip"><span class="timer-dot"></span> ${fmtTime(state.timeLeftSec)}</span></div>
    </div>
    <div class="container" style="padding-top:14px;">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    </div>
    <div class="test-body">
      <div class="test-card card pad-lg">
        <div class="q-index">SAVOL ${state.qIndex+1} / ${total} &nbsp;·&nbsp; JAVOB BERILDI: ${answeredCount}/${total}</div>
        <div class="q-text">${escapeHtml(q.text)}</div>
        ${options}
        <div class="test-nav">
          <button class="btn btn-ghost btn-sm" onclick="prevQuestion()" ${state.qIndex===0?'disabled':''}>← Oldingi</button>
          ${state.qIndex===total-1
            ? `<button class="btn btn-primary" onclick="confirmFinish()">Testni yakunlash ✓</button>`
            : `<button class="btn btn-primary btn-sm" onclick="nextQuestion()">Keyingi →</button>`}
        </div>
        <div class="qnav-grid">${dots}</div>
      </div>
    </div>
  `;
}

function selectOption(i){
  const q = state.quiz[state.qIndex];
  state.answers[q.id] = i;
  renderTest();
}
function nextQuestion(){ if(state.qIndex < state.quiz.length-1){ state.qIndex++; renderTest(); } }
function prevQuestion(){ if(state.qIndex>0){ state.qIndex--; renderTest(); } }
function jumpTo(i){ state.qIndex=i; renderTest(); }

function confirmFinish(){
  const total = state.quiz.length;
  const answered = Object.keys(state.answers).length;
  if(answered < total){
    if(!confirm(`Siz ${total-answered} ta savolga javob bermadingiz. Baribir yakunlansinmi?`)) return;
  }
  finishTest(false);
}

async function finishTest(terminated){
  clearTimer();
  document.removeEventListener('visibilitychange', onVisibilityChange);
  let score = 0;
  const detail = state.quiz.map(q=>{
    const selected = state.answers[q.id];
    const isCorrect = selected!==undefined && selected===q.correctIndex;
    if(isCorrect) score++;
    return {
      text:q.text, options:q.options,
      selectedIndex: selected===undefined? null : selected,
      correctIndex:q.correctIndex, isCorrect
    };
  });
  const total = state.quiz.length;
  const result = {
    id: uid(),
    subject: state.subject,
    student: state.student,
    score, total,
    percent: total? Math.round((score/total)*100) : 0,
    status: terminated ? 'terminated' : 'completed',
    detail,
    device: navigator.userAgent.slice(0,140),
    startedAt: Date.now(),
    finishedAt: Date.now(),
  };
  await saveResult(result);
  state.lastResult = result;
  state.view = 'result';
  render();
}

function adminLogout(){ state.admin.loggedIn=false; goHome(); }

function renderAdminTabContent(){
  const main = document.getElementById('adminMain');
  if(state.admin.tab==='natijalar') return renderAdminResultsTab(main);
  if(state.admin.tab==='savollar') return renderAdminQuestionsTab(main);
  if(state.admin.tab==='sozlamalar') return renderAdminSettingsTab(main);

}

/* --- Results tab --- */
function renderAdminResultsTab(main){

  const rows = results.map(r=>{
    const s = SUBJECTS[r.subject];
    return `<tr class="clickable" onclick="openResultDetail('${r.id}')">
      <td>${escapeHtml(r.student.ism)} ${escapeHtml(r.student.familiya)}</td>
      <td>${escapeHtml(r.student.guruh)}</td>
      <td><span class="badge badge-blue">${s.icon} ${s.short}</span></td>
      <td>${r.score}/${r.total} <span style="color:var(--ink-faint);">(${r.percent}%)</span></td>
      <td>${r.status==='terminated'?'<span class="badge badge-red">To\'xtatilgan</span>':'<span class="badge badge-green">Yakunlangan</span>'}</td>
      <td style="color:var(--ink-faint);font-size:12.5px;">${fmtDate(r.finishedAt)}</td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div class="admin-topline">
      <h2 style="font-size:24px;">Talabalar natijalari</h2>
      <button class="btn btn-ghost btn-sm" onclick="reloadResults()">⟳ Yangilash</button>
    </div>
    <div class="stat-cards">
      <div class="stat-card"><b>${total}</b><span>Jami urinishlar</span></div>
      <div class="stat-card"><b>${avg}%</b><span>O'rtacha natija</span></div>
      <div class="stat-card"><b>${terminated}</b><span>To'xtatilgan testlar</span></div>
    </div>
    <div class="card pad" style="overflow-x:auto;">
      ${total? `<table><thead><tr><th>Ism familiya</th><th>Guruh</th><th>Fan</th><th>Ball</th><th>Holat</th><th>Vaqt</th></tr></thead><tbody>${rows}</tbody></table>`
        : `<div class="empty-state"><b>Hali natijalar yo'q</b>Talabalar test topshirgach, bu yerda ko'rinadi.</div>`}
    </div>
  `;
}
async function reloadResults(){ await refreshAdminResults(); renderAdminTabContent(); }

function openResultDetail(id){
  state.admin.resultDetail = state.admin.results.find(r=>r.id===id);
  const r = state.admin.resultDetail;
  const s = SUBJECTS[r.subject];
  const rows = r.detail.map((d,i)=>`
    <div class="q-preview-card">
      <div style="font-weight:600;margin-bottom:8px;">${i+1}. ${escapeHtml(d.text)} ${d.isCorrect? '<span class="badge badge-green">To\'g\'ri</span>':'<span class="badge badge-red">Noto\'g\'ri</span>'}</div>
      ${d.options.map((opt,oi)=>{
        let cls='opt-row';
        if(oi===d.correctIndex) cls+=' correct';
        let tag='';
        if(oi===d.selectedIndex && oi===d.correctIndex) tag=' ✓ (tanlangan, to\'g\'ri)';
        else if(oi===d.selectedIndex) tag=' ← tanlangan javob';
        else if(oi===d.correctIndex) tag=' (to\'g\'ri javob)';
        return `<div class="${cls}"><span class="opt-mark">${String.fromCharCode(65+oi)}</span>${escapeHtml(opt)}${tag}</div>`;
      }).join('')}
    </div>
  `).join('');

  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-bg" id="detailModal" onclick="if(event.target.id==='detailModal') closeModal()">
      <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
          <div>
            <h3 style="font-size:19px;">${escapeHtml(r.student.ism)} ${escapeHtml(r.student.familiya)}</h3>
            <div style="font-size:13px;color:var(--ink-soft);">${s.icon} ${s.label} · ${escapeHtml(r.student.guruh)} · ${escapeHtml(r.student.email)}</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
        </div>
        <div class="badge badge-blue" style="margin-bottom:14px;">Natija: ${r.score}/${r.total} (${r.percent}%)</div>
        ${rows}
      </div>
    </div>
  `);
}
function closeModal(){ const m=document.getElementById('detailModal'); if(m) m.remove(); }

    <div class="q-preview-card">
      <div style="display:flex;justify-content:space-between;gap:10px;">
        <div style="font-weight:600;flex:1;">${i+1}. ${escapeHtml(q.text)}</div>
      </div>
      ${q.options.map((opt,oi)=>`<div class="opt-row ${oi===q.correctIndex?'correct':''}"><span class="opt-mark">${String.fromCharCode(65+oi)}</span>${escapeHtml(opt)}${oi===q.correctIndex?' ✓':''}</div>`).join('')}

        <button class="btn btn-danger btn-sm" onclick="deleteQuestion('${q.id}')">🗑 O'chirish</button>

  `).join('');

    ${msg}

      <button class="btn btn-ghost btn-sm" onclick="exportBackup()">⬇ Zaxira nusxa (barcha fanlar)</button>

    </div>
    <div class="grid-2" style="align-items:start;">
      <div class="card pad">
        <h3 style="font-size:16px;margin-bottom:10px;">Savollarni ommaviy yuklash</h3>
        <p class="hint" style="margin-bottom:10px;">Har bir savol: 1-qator savol matni, keyingi 4 qator variantlar. To'g'ri javob oldiga <b>#</b> belgisi qo'ying. Savollarni bo'sh qator bilan ajrating.</p>
        <textarea id="bulkText" placeholder="2+2 nechchiga teng?
3
#4
5
6

Suvning kimyoviy formulasi?
CO2
NaCl
#H2O
O2"></textarea>
        <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="submitBulk()">Yuklash</button>
      </div>
      <div class="card pad">
        <h3 style="font-size:16px;margin-bottom:10px;">Bitta savol qo'shish</h3>
        <div class="field"><input id="sq-text" placeholder="Savol matni"></div>
        <div class="field"><input id="sq-o0" placeholder="A variant"></div>
        <div class="field"><input id="sq-o1" placeholder="B variant"></div>
        <div class="field"><input id="sq-o2" placeholder="C variant"></div>
        <div class="field"><input id="sq-o3" placeholder="D variant"></div>
        <div class="field">
          <label>To'g'ri javob</label>
          <select id="sq-correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
        </div>
        <button class="btn btn-primary btn-sm" onclick="submitSingle()">Qo'shish</button>
      </div>
    </div>
    <h3 style="font-size:16px;margin:24px 0 12px;">Bazadagi savollar (${bank.length}) — talabalar shu tarzda ko'radi</h3>
    ${bank.length ? cards : `<div class="empty-state"><b>Hali savol qo'shilmagan</b>Yuqoridagi shakl orqali savollarni yuklang.</div>`}

}

function parseBulkQuestions(text){
  const blocks = text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const parsed = []; const errors = [];
  blocks.forEach((block,bi)=>{
    const lines = block.split('\n').map(l=>l.trim()).filter(l=>l.length);
    if(lines.length !== 5){ errors.push(`Blok ${bi+1}: 5 qator (1 savol + 4 variant) bo'lishi kerak.`); return; }
    const qtext = lines[0];
    const opts = lines.slice(1,5);
    let correctIndex = -1;
    const clean = opts.map((o,i)=>{
      if(o.startsWith('#')){ correctIndex=i; return o.slice(1).trim(); }
      return o;
    });
    if(correctIndex===-1){ errors.push(`Blok ${bi+1}: to'g'ri javob (# belgisi) topilmadi.`); return; }
    parsed.push({id:uid(), text:qtext, options:clean, correctIndex});
  });
  return {parsed, errors};
}

async function submitBulk(){
  const text = document.getElementById('bulkText').value;
  if(!text.trim()){ return; }
  const {parsed, errors} = parseBulkQuestions(text);
  if(!parsed.length){
    state.admin.msg = {type:'error', text:`Hech qanday savol o'qib bo'lmadi. ${errors.join(' ')}`};
    renderQuestionsPane(); return;
  }
  const bank = state.admin._bank || [];
  const updated = bank.concat(parsed);
  const ok = await saveQuestions(state.admin.qSubject, updated);
  if(!ok){
    state.admin.msg = {type:'error', text:"Saqlashda xatolik yuz berdi — brauzeringiz xotirasi to'lgan yoki bloklangan bo'lishi mumkin. Pastdagi «Zaxira nusxa» orqali faylga eksport qilib, keyin qayta urinib ko'ring."};
    renderQuestionsPane(); return;
  }
  document.getElementById('bulkText').value = '';
  state.admin.msg = errors.length
    ? {type:'warn', text:`${parsed.length} ta savol qo'shildi. ${errors.length} ta xato: ${errors.join(' ')}`}
    : {type:'ok', text:`${parsed.length} ta savol muvaffaqiyatli qo'shildi.`};
  renderQuestionsPane();
}

async function submitSingle(){
  const text = document.getElementById('sq-text').value.trim();
  const opts = [0,1,2,3].map(i=>document.getElementById('sq-o'+i).value.trim());
  const correctIndex = parseInt(document.getElementById('sq-correct').value,10);
  if(!text || opts.some(o=>!o)){
    state.admin.msg = {type:'error', text:"Iltimos barcha maydonlarni to'ldiring."};
    renderQuestionsPane(); return;
  }
  const bank = state.admin._bank || [];
  const updated = bank.concat([{id:uid(), text, options:opts, correctIndex}]);
  const ok = await saveQuestions(state.admin.qSubject, updated);
  if(!ok){
    state.admin.msg = {type:'error', text:"Saqlashda xatolik yuz berdi. «Zaxira nusxa» orqali faylga eksport qilib turing."};
    renderQuestionsPane(); return;
  }
  document.getElementById('sq-text').value='';
  [0,1,2,3].forEach(i=>document.getElementById('sq-o'+i).value='');
  state.admin.msg = {type:'ok', text:'Savol qo\'shildi.'};
  renderQuestionsPane();
}

function editQuestion(qid){
  const bank = state.admin._bank || [];
  const q = bank.find(x=>x.id===qid);
  if(!q) return;
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-bg" id="editModal" onclick="if(event.target.id==='editModal') closeEditModal()">
      <div class="modal-box">
        <h3 style="font-size:18px;margin-bottom:16px;">Savolni tahrirlash</h3>
        <div class="field"><label>Savol matni</label><input id="eq-text" value="${escapeHtml(q.text)}"></div>
        ${[0,1,2,3].map(i=>`<div class="field"><label>Variant ${String.fromCharCode(65+i)}</label><input id="eq-o${i}" value="${escapeHtml(q.options[i])}"></div>`).join('')}
        <div class="field">
          <label>To'g'ri javob</label>
          <select id="eq-correct">${[0,1,2,3].map(i=>`<option value="${i}" ${q.correctIndex===i?'selected':''}>${String.fromCharCode(65+i)}</option>`).join('')}</select>
        </div>
        <div style="display:flex;gap:10px;margin-top:8px;">
          <button class="btn btn-ghost btn-block" onclick="closeEditModal()">Bekor qilish</button>
          <button class="btn btn-primary btn-block" onclick="saveEditedQuestion('${qid}')">Saqlash</button>
        </div>
      </div>
    </div>`);
}
function closeEditModal(){ const m=document.getElementById('editModal'); if(m) m.remove(); }
async function saveEditedQuestion(qid){
  const bank = state.admin._bank || [];
  const q = bank.find(x=>x.id===qid);
  if(!q) return;
  const backup = JSON.parse(JSON.stringify(q));
  q.text = document.getElementById('eq-text').value.trim();
  q.options = [0,1,2,3].map(i=>document.getElementById('eq-o'+i).value.trim());
  q.correctIndex = parseInt(document.getElementById('eq-correct').value,10);
  const ok = await saveQuestions(state.admin.qSubject, bank);
  closeEditModal();
  if(!ok){
    Object.assign(q, backup);
    state.admin.msg = {type:'error', text:"Saqlashda xatolik yuz berdi. O'zgarish bekor qilindi."};
  } else {
    state.admin.msg = {type:'ok', text:'Savol yangilandi.'};
  }
  renderQuestionsPane();
}
async function deleteQuestion(qid){
  if(!confirm("Savolni o'chirishni tasdiqlaysizmi?")) return;
  const bank = state.admin._bank || [];
  const filtered = bank.filter(x=>x.id!==qid);
  const ok = await saveQuestions(state.admin.qSubject, filtered);
  state.admin.msg = ok ? {type:'ok', text:"Savol o'chirildi."} : {type:'error', text:"O'chirishda xatolik yuz berdi."};
  renderQuestionsPane();
}

/* --- Backup / restore (works regardless of storage mode) --- */
async function exportBackup(){
  const data = { exportedAt: new Date().toISOString(), settings: state.settings, questions: {} };
  for(const k of Object.keys(SUBJECTS)){
    data.questions[k] = await loadQuestions(k);
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `azmath_zaxira_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(data.settings){ state.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings); await saveSettings(); }
    if(data.questions){
      for(const k of Object.keys(SUBJECTS)){
        if(Array.isArray(data.questions[k])) await saveQuestions(k, data.questions[k]);
      }
    }
    state.admin.msg = {type:'ok', text:"Zaxira nusxadan muvaffaqiyatli tiklandi."};
  }catch(e){
    state.admin.msg = {type:'error', text:"Fayl noto'g'ri formatda. Faqat shu tizim eksport qilgan .json fayl yuklang."};
  }
  evt.target.value='';
  renderQuestionsPane();
}

  const rows = Object.entries(SUBJECTS).map(([k,s])=>{
    const cfg = state.settings.subjects[k];
    return `
    <div class="card pad" style="margin-bottom:14px;">

        <div class="field"><label>Vaqt (daqiqa)</label><input type="number" min="1" id="time-${k}" value="${cfg.time}"></div>
      </div>
    </div>`;

  main.innerHTML = `

    <div id="settingsMsg" style="margin-top:14px;"></div>

}
async function saveSubjectSettings(){
  const prev = JSON.parse(JSON.stringify(state.settings.subjects));
  Object.keys(SUBJECTS).forEach(k=>{
    const cnt = parseInt(document.getElementById('cnt-'+k).value,10) || 10;
    const time = parseInt(document.getElementById('time-'+k).value,10) || 15;
    state.settings.subjects[k] = {count:cnt, time:time};
  });
  const ok = await saveSettings();
  if(!ok){
    state.settings.subjects = prev;
    document.getElementById('settingsMsg').innerHTML = `<div class="msg-banner error">Saqlashda xatolik yuz berdi. Qayta urinib ko'ring.</div>`;
    return;
  }
  document.getElementById('settingsMsg').innerHTML = `<div class="msg-banner ok">Sozlamalar saqlandi.</div>`;
}

/* --- Login change tab --- */
function renderAdminLoginChangeTab(main){
  main.innerHTML = `
    <div class="admin-topline"><h2 style="font-size:24px;">Login va parolni o'zgartirish</h2></div>
    <div class="card pad" style="max-width:420px;">
      <div class="field"><label>Yangi login</label><input id="nl-login" value="${escapeHtml(state.settings.login)}"></div>
      <div class="field"><label>Yangi parol</label><input id="nl-pass" type="text" value="${escapeHtml(state.settings.password)}"></div>
      <button class="btn btn-primary" onclick="saveCredentials()">Saqlash</button>
      <div id="credMsg" style="margin-top:12px;"></div>
      <p class="hint">O'zgartirilgan login va parol keyingi safar kirishda ham saqlanib qoladi.</p>
    </div>
  `;
}
async function saveCredentials(){
  const login = document.getElementById('nl-login').value.trim();
  const pass = document.getElementById('nl-pass').value.trim();
  if(!login || !pass){ document.getElementById('credMsg').innerHTML=`<div class="msg-banner error">Login va parol bo'sh bo'lmasligi kerak.</div>`; return; }
  const prevLogin = state.settings.login, prevPass = state.settings.password;
  state.settings.login = login;
  state.settings.password = pass;
  const ok = await saveSettings();
  if(!ok){
    state.settings.login = prevLogin; state.settings.password = prevPass;
    document.getElementById('credMsg').innerHTML = `<div class="msg-banner error">Saqlashda xatolik yuz berdi. Qayta urinib ko'ring.</div>`;
    return;
  }
  document.getElementById('credMsg').innerHTML = `<div class="msg-banner ok">Login va parol muvaffaqiyatli yangilandi.</div>`;
}

/* ============================= INIT ============================= */

  await loadSettings();
  render();
  setInterval(()=>{
    if(state.view==='adminDashboard' && state.admin.tab==='natijalar'){ reloadResults(); }
  }, 20000);
}
init();
</script>
